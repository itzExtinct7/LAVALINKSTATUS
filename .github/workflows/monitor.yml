name: Monitor Lavalink

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lavalink-status-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LAVALINK_HOST: ${{ vars.LAVALINK_HOST || 'budget-us7.bot.heavencloud.in' }}
      LAVALINK_PORT: ${{ vars.LAVALINK_PORT || '6706' }}
      LAVALINK_SECURE: ${{ vars.LAVALINK_SECURE || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll Lavalink REST API
        run: python monitor.py

      - name: Publish status snapshot and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          if git diff --cached --quiet; then
            echo "No status data changes to publish."
          else
            git commit -m "chore: update Lavalink status [skip ci]"
            git push
          fi
